name: Build and Push to GHCR (qwen-fast — network-volume)

on:
  push:
    branches: [main, master]
    tags: ["late2", "v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get clean
          sudo docker system prune -af
          df -h
          echo "FAST image — no 20GB GGUF bake, build should be ~3 min."

      - name: Build and push qwen-fast
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          target: final
          build-args: |
            MODEL_TYPE=qwen-image-edit
            COMFYUI_VERSION=0.29.0
            CUDA_VERSION_FOR_COMFY=12.6
            USE_NETWORK_VOLUME=true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-qwen-fast:latest
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-qwen-fast:qwen-image-edit
            ghcr.io/${{ steps.owner.outputs.owner }}/darkcoal-qwen-fast:late2
